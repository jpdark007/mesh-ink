name: RAM accounting diagnostic
on:
  push:
    branches: [mesh-agnostic-refine]
  workflow_dispatch:
jobs:
  ram-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio Pillow
      - name: Build diagnostic firmware
        run: |
          set -o pipefail
          pio run -e t5-unified-cache64-ram-audit 2>&1 | tee ram-audit-build.log
      - name: Produce memory/linker inventory
        if: always()
        shell: bash
        run: |
          mkdir -p ram-audit-output
          cp ram-audit-build.log ram-audit-output/
          BUILD=.pio/build/t5-unified-cache64-ram-audit
          test -s "$BUILD/firmware.bin"
          test -s "$BUILD/firmware.elf"
          find "$BUILD" -name '*.map' -size +0c -print -quit | grep -q .
          cp "$BUILD/firmware.bin" "$BUILD/firmware.elf" ram-audit-output/
          find "$BUILD" -name '*.map' -size +0c -exec cp {} ram-audit-output/ \;
          pio run -e t5-unified-cache64-ram-audit -t size > ram-audit-output/size.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meshink-ram-audit-test33
          path: ram-audit-output/
          retention-days: 14
