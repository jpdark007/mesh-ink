name: RAM accounting diagnostic
on:
  push:
    branches: [mesh-agnostic-refine]
  workflow_dispatch:
jobs:
  ram-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio
      - name: Build diagnostic firmware
        run: pio run -e t5-unified-cache64-ram-audit 2>&1 | tee ram-audit-build.log
      - name: Produce memory/linker inventory
        if: always()
        shell: bash
        run: |
          mkdir -p ram-audit-output
          cp ram-audit-build.log ram-audit-output/ 2>/dev/null || true
          find .pio/build/t5-unified-cache64-ram-audit -maxdepth 2 \\( -name '*.map' -o -name 'firmware.elf' -o -name 'firmware.bin' \\) -exec cp {} ram-audit-output/ \\; 2>/dev/null || true
          pio run -e t5-unified-cache64-ram-audit -t size > ram-audit-output/size.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meshink-ram-audit-test33
          path: ram-audit-output/
          retention-days: 14
